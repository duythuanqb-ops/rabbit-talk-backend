services:
  mysql:
    image: mysql:8.0
    container_name: ribbittalk_db
    restart: on-failure
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ribbittalk
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '--silent']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    profiles: [prod]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ribbittalk
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_DATABASE=ribbittalk
      - FRONTEND_URL=http://localhost:3004
    depends_on:
      mysql:
        condition: service_healthy
    stdin_open: true
    tty: true

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ribbittalk_migrate
    command: npm run db:migrate
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_DATABASE=ribbittalk
    volumes:
      - ./src/database/migrations:/app/src/database/migrations
      - ./scripts:/app/scripts
    depends_on:
      mysql:
        condition: service_healthy

  web-dev:
    container_name: ribbittalk_dev
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=development
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_DATABASE=ribbittalk
      - FRONTEND_URL=http://localhost:3004
    command: sh -c "npm install && npm run start:dev"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  db_data:
  backend_node_modules:
